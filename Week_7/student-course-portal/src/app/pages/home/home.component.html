<div style="padding: 20px;">
  <h1>{{ portalName }}</h1>
  <p>Welcome to the Student Course Portal. Browse and enroll in courses, check your grades, and manage your profile.</p>

  <!-- Two-way binding with ngModel -->
  <div style="margin: 15px 0;">
    <input [(ngModel)]="searchTerm" placeholder="Search courses..." style="padding: 8px; width: 300px;">
    <p>Searching for: {{ searchTerm }}</p>
  </div>

  <!-- Property binding and event binding -->
  <button [disabled]="!isPortalActive" (click)="onEnrollClick()" style="padding: 10px 20px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer;">
    Enroll Now
  </button>
  <p *ngIf="message" style="color: green; margin-top: 10px;">{{ message }}</p>

  <!-- Stats row -->
  <div style="display: flex; gap: 20px; margin-top: 20px;">
    <div style="background: #e3f2fd; padding: 20px; border-radius: 8px; flex: 1; text-align: center;">
      <h3>{{ coursesAvailable }}</h3>
      <p>Courses Available</p>
    </div>
    <div style="background: #e8f5e9; padding: 20px; border-radius: 8px; flex: 1; text-align: center;">
      <h3>3</h3>
      <p>Enrolled</p>
    </div>
    <div style="background: #fff3e0; padding: 20px; border-radius: 8px; flex: 1; text-align: center;">
      <h3>3.8</h3>
      <p>GPA</p>
    </div>
  </div>
</div>
