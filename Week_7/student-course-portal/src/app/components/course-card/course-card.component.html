<div class="course-card" [ngClass]="cardClasses" [ngStyle]="{'border-left': cardBorder}" appHighlight>
  <h3>{{ course.name }}</h3>
  <p><strong>Code:</strong> {{ course.code }}</p>
  <p><strong>Credits:</strong> {{ course.credits | creditLabel }}</p>
  <p>
    <strong>Status:</strong>
    <span [ngSwitch]="course.gradeStatus">
      <span *ngSwitchCase="'passed'" style="background: green; color: white; padding: 2px 8px; border-radius: 4px;">Passed</span>
      <span *ngSwitchCase="'failed'" style="background: red; color: white; padding: 2px 8px; border-radius: 4px;">Failed</span>
      <span *ngSwitchDefault style="background: grey; color: white; padding: 2px 8px; border-radius: 4px;">Pending</span>
    </span>
  </p>
  <button (click)="enrollRequested.emit(course.id)" style="padding: 8px 16px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">
    {{ enrolled ? 'Unenroll' : 'Enroll' }}
  </button>
  <button (click)="toggleExpand()" style="padding: 8px 16px; background: #757575; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; margin-left: 5px;">
    {{ isExpanded ? 'Hide Details' : 'Show Details' }}
  </button>
</div>
